minimumReleaseAge: 10080 # Minutes -- (7 days)
minimumReleaseAgeExclude:
  - "@biomejs/*"
  - "@effect/language-service"
  - "@types/node"
  - "tsx"

catalogs:
  biome:
    "@biomejs/biome": "^2.5.9"
  effect:
    "@effect/language-service": "0.87.1"
    "@effect/platform-node": "4.0.0-beta.102"
    "@effect/sql-sqlite-node": "4.0.0-beta.102"
    "effect": "4.0.0-beta.102"
  electron:
    "electron": "^43.4.0"
  node:
    "@types/node": ^26.1.2
  tooling:
    "knip": ^6.31.0
    "npm-run-all2": ^9.0.3
  runtime:
    "dotenv": 17.4.2
  testing:
    "vitest": "^4.1.10"
  typescript:
    "tsx": ^4.23.5
    "typescript": ^7.0.2
  vite:
    "vite": "^8.2.1"

allowBuilds:
  better-sqlite3: true
  esbuild: true
  msgpackr-extract: false
